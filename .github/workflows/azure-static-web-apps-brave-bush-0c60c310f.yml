name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Inject Web Chat Direct Line secret
        env:
          WEBCHAT_DIRECTLINE_SECRET: ${{ secrets.WEBCHAT_DIRECTLINE_SECRET }}
        run: |
          test -n "$WEBCHAT_DIRECTLINE_SECRET"
          python3 - <<'PY'
          import os
          path = "starter/ContosoDentistryWebsite/index.html"
          secret = os.environ["WEBCHAT_DIRECTLINE_SECRET"]
          text = open(path, encoding="utf-8").read()
          if "WEBCHAT_SECRET_PLACEHOLDER" not in text:
              raise SystemExit("placeholder missing in index.html")
          open(path, "w", encoding="utf-8").write(
              text.replace("WEBCHAT_SECRET_PLACEHOLDER", secret)
          )
          print("Injected Web Chat secret into index.html")
          PY
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BUSH_0C60C310F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "starter/ContosoDentistryWebsite"
          api_location: ""
          output_location: "."

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BUSH_0C60C310F }}
          action: "close"
